name: ci

# The gate for this repository: the same five checks `npm run check` runs locally, as separate
# steps so a failure names itself in the job summary rather than hiding behind one script.
#
# Node 20 is the floor both packages declare, and the version the VS Code extension host runs
# is newer than that, so the matrix pins the floor and the current LTS: a plugin that only
# compiles on the newest Node is a plugin some editors cannot load.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # The compiler is a pinned submodule until it publishes (`docs/design.md` §2), and
          # every artifact here bundles it, so a checkout without it fails at the first import
          # rather than at a later, more confusing step.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Before the type check, because the tsserver test loads the built bundle: the plugin is
      # what tsserver `require`s, so the suite would otherwise test a stale one or none at all.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:prose
      - run: npm run test

  electron:
    name: extension tests in a real VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `xvfb-run` because VS Code is an Electron application and exits immediately with
      # "Missing X server or $DISPLAY" without one. This is the environment the VS Code team
      # documents for the runner, and the reason this is a separate job: it downloads a 327 MB
      # build, and a Marketplace publish must not wait on it (`docs/design.md` §6).
      - run: xvfb-run -a npm run test:electron
