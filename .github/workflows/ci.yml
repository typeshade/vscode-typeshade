name: ci

# The gate for this repository: the same five checks `npm run check` runs locally, as separate
# steps so a failure names itself in the job summary rather than hiding behind one script.
#
# Node 20 is the floor both packages declare, and the version the VS Code extension host runs
# is newer than that, so the matrix pins the floor and the current LTS: a plugin that only
# compiles on the newest Node is a plugin some editors cannot load.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `publish-mcp.yml` calls this workflow, so the gate a release runs is literally the job below
  # rather than a second copy that can drift into a weaker one.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
        with:
          # The compiler is a pinned submodule until it publishes (`docs/design.md` §2), and
          # every artifact here bundles it, so a checkout without it fails at the first import
          # rather than at a later, more confusing step.
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Before the type check, because the tsserver test loads the built bundle: the plugin is
      # what tsserver `require`s, so the suite would otherwise test a stale one or none at all.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:prose
      - run: npm run test
