name: ci

# The gate for this repository: the same five checks `npm run check` runs locally, as separate
# steps so a failure names itself in the job summary rather than hiding behind one script. On a
# pull request, `compiler-bump` also checks what a move of the compiler pin owes this repository.
#
# Node 20 is the floor both packages declare, and the version the VS Code extension host runs
# is newer than that, so the matrix pins the floor and the current LTS: a plugin that only
# compiles on the newest Node is a plugin some editors cannot load.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `publish-mcp.yml` calls this workflow, so the gate a release runs is literally the job below
  # rather than a second copy that can drift into a weaker one.
  workflow_call:

permissions:
  contents: read

env:
  # `@vscode/test-web` depends on `@playwright/browser-chromium`, whose install script downloads
  # a browser during every `npm ci`. Only the `web` job needs one, and it fetches it explicitly
  # (`npx playwright install`, which this variable does not stop), so the required checks and the
  # release jobs never wait on a Chromium download.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
        with:
          # The compiler is a pinned submodule until it publishes (`docs/design.md` §2), and
          # every artifact here bundles it, so a checkout without it fails at the first import
          # rather than at a later, more confusing step.
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Before the type check, because the tsserver test loads the built bundle: the plugin is
      # what tsserver `require`s, so the suite would otherwise test a stale one or none at all.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:prose
      - run: npm run test

  compiler-bump:
    # What a compiler bump owes this repository. A doc, package or test that still names an
    # export or a file the new pin removes fails here, as does a compiler ThenChange target in
    # this repository (a `//vscode-typeshade/...` path) that this branch did not change; then this
    # repository's own IfChange pairs are held to the diff. Both scripts run from the pinned
    # compiler (vendor/typeshade/scripts/downstream-impact.ts and ifchange.ts), so a pin from
    # before they existed skips the job's checks.
    name: compiler bump impact
    # A pull request, or a run dispatched on a branch: pin-compiler.yml opens its pull request
    # with GITHUB_TOKEN, which starts no pull_request run, and dispatches this workflow instead.
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Both pins of the compiler and the base branch of this repository.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: What the compiler bump owes this repository
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          if [ ! -f vendor/typeshade/scripts/downstream-impact.ts ]; then
            echo "The pinned compiler predates scripts/downstream-impact.ts; nothing to check."
            exit 0
          fi
          bun vendor/typeshade/scripts/downstream-impact.ts --repo vscode-typeshade \
            --submodule vendor/typeshade --base "origin/$BASE" --check
          TYPESHADE_DOCS_ROOT="$PWD" bun vendor/typeshade/scripts/ifchange.ts --base "origin/$BASE"

  electron:
    name: extension tests in a real VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `xvfb-run` because VS Code is an Electron application and exits immediately with
      # "Missing X server or $DISPLAY" without one. This is the environment the VS Code team
      # documents for the runner, and the reason this is a separate job: it downloads a 327 MB
      # build. Not a required check, but `publish-extension.yml` calls this whole workflow, so a
      # red run here holds a release (`docs/design.md` §6).
      - run: xvfb-run -a npm run test:electron
      # The same suite against the packaged extension: the directory the .vsix is packed from, so
      # the plugin loads from the package's own node_modules as it will for a user
      # (scripts/package-extension.mjs, docs/design.md §7).
      - run: node scripts/package-extension.mjs
      - run: xvfb-run -a node packages/vscode-typeshade/dist/test-electron/main.js
        env:
          TYPESHADE_EXTENSION_PATH: out/extension

  web:
    # The packaged extension in a browser build of VS Code, in a headless Chromium
    # (`scripts/test-web.mjs`, `docs/design.md` §6). Each cell is one VS Code build, always named by
    # commit: `--quality stable` alone serves whatever is newest that day, and a check that changes
    # under an unchanged repository is not a check. The commits are the releases named in the
    # matrix, bumped by hand when a new stable is worth testing.
    #
    #   1.139.1, isolated     the current stable, as vscode.dev runs it
    #   1.110.0, isolated     the first VS Code for the Web that loads a plugin from an extension
    #                         (`FIRST_WEB_PLUGIN_VERSION`): the floor the extension warns below
    #   1.139.1, not isolated a page without cross-origin isolation, where TypeScript's semantic
    #                         server does not run: the suite asserts the warning and the stubs
    #
    # Not a required check: `.github/workflows/publish-extension.yml` calls this workflow, so a
    # red cell already holds a release, and a merge is not held on a Chromium download.
    name: extension tests in VS Code for the Web (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 1.139.1, isolated
            commit: 04c0d99f4fb0d8afe6ce4f0c58e31e183ac3e4b1
            coi: 'true'
          - label: 1.110.0, isolated
            commit: 0870c2a0c7c0564e7631bfed2675573a94ba4455
            coi: 'true'
          - label: 1.139.1, not isolated
            commit: 04c0d99f4fb0d8afe6ce4f0c58e31e183ac3e4b1
            coi: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser and the system libraries it needs, at the revision the locked Playwright asks
      # for. `@vscode/test-web` drives it; nothing else here does.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/package-extension.mjs
      # What the manifest tells VS Code and what the package carries, read from the .vsix itself:
      # `vsce` checks that the extension's `browser` file exists and never opens the plugin's
      # package.json, and a web host that finds no `browser` field skips the plugin without an
      # error. Without the extension kind and the tag the Marketplace and vscode.dev would not
      # offer the extension on the web at all.
      - name: The package is a web extension and carries both entry points
        run: |
          set -eu
          vsix=$(ls out/*.vsix)
          manifest=$(unzip -p "$vsix" extension.vsixmanifest)
          listing=$(unzip -l "$vsix")
          fail=0
          grep -q 'Id="Microsoft.VisualStudio.Code.ExtensionKind" Value="workspace,web"' <<<"$manifest" ||
            { echo "::error::extension.vsixmanifest does not declare ExtensionKind workspace,web"; fail=1; }
          grep -q '__web_extension' <<<"$manifest" ||
            { echo "::error::extension.vsixmanifest lacks the __web_extension tag"; fail=1; }
          for entry in extension/dist/web/extension.js extension/node_modules/@typeshade/tsserver-plugin/index.web.js; do
            grep -q " $entry\$" <<<"$listing" || { echo "::error::$vsix lacks $entry"; fail=1; }
          done
          exit "$fail"
      # One build per commit; `@vscode/test-web` downloads it (about 55 MB) on a miss. The key is the
      # commit, which never changes what it names, so an entry is never stale.
      - uses: actions/cache@v4
        with:
          path: .vscode-test-web/${{ matrix.commit }}
          key: vscode-web-${{ matrix.commit }}
      # The suite runs against what the .vsix unpacks to, not the directory it was packed from, so
      # a file the packaging dropped is missing here as it would be for a user.
      - name: Unpack the package the suite runs against
        run: unzip -q out/*.vsix -d out/vsix
      - run: node scripts/test-web.mjs
        env:
          TYPESHADE_EXTENSION_PATH: out/vsix/extension
          TYPESHADE_WEB_COMMIT: ${{ matrix.commit }}
          TYPESHADE_WEB_COI: ${{ matrix.coi }}
