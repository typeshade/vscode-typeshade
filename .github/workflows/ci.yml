name: ci

# The gate for this repository: the same five checks `npm run check` runs locally, as separate
# steps so a failure names itself in the job summary rather than hiding behind one script.
#
# Node 20 is the floor both packages declare, and the version the VS Code extension host runs
# is newer than that, so the matrix pins the floor and the current LTS: a plugin that only
# compiles on the newest Node is a plugin some editors cannot load.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:prose
      - run: npm run test
